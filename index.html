<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Gamernik Eyebrows</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="images/Logo.jpg" alt="Logo of Maya Gamernik Eyebrows"> 
        <h1>Maya Gamernik Eyebrows</h1>
    </header>
    <nav> 
        <a href="#gallery">Gallery</a>
        <a href="#booking">Booking</a>
    </nav>
    <main>
        <section id="services">
        <h2>What I Offer</h2>
        <p>Professional eyebrow and lash treatments for a natural, polished look.</p>
        <ul>
            <li>Natural eyebrow shaping</li>
            <li>Eyebrow restoration</li>
            <li>Lash lift</li>
        </ul>
        </section>
        <section id="gallery">
            <h2>My Work</h2> 
            <img src="images/img1.jpeg" alt="Maya shaping a client's eyebrows during a treatment">
            <img src="images/img2.jpeg" alt="Close-up of a freshly shaped natural eyebrow">
            <img src="images/img3.jpeg" alt="Lash lift result">
        </section>
        <section id="booking">
            <h2>Book an Appointment</h2>
            <form action="">
                <label for="customer-name">Name</label>
                <input type="text" id="customer-name" name="customer-name" required>
                <label for="book-date">Choose a date</label>
                <input type="date" id="book-date" name="date" required>
                <button type="submit">Book</button>
            </form>
        </section>
    </main>
    <footer>
        <a href="https://wa.me/972547664902" target="_blank">WhatsApp</a>
        <a href="https://www.instagram.com/maya_gamernikk_eyebrows/" target="_blank">Instagram</a>
    </footer>

</body>
</html>
